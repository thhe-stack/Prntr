<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prntr · TM-m30II</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --ink:#e8eaed; --mut:#9aa3b2; --accent:#ff6a3d;
    --ok:#39d98a; --warn:#ffb020; --bad:#ff5d5d; --paper:#fbfbf7;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#eef0f4; --card:#fff; --card2:#f4f6fa; --line:#e2e6ee;
           --ink:#1c2430; --mut:#5d6675; --shadow:0 10px 30px rgba(20,30,50,.10); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px; display:flex; justify-content:center;
  }
  .app{width:100%; max-width:920px}
  header{display:flex; align-items:center; gap:12px; margin:6px 2px 18px; flex-wrap:wrap}
  .logo{font-weight:800; font-size:22px; letter-spacing:.5px}
  .logo span{color:var(--accent)}
  .status{margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--mut); font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .ver{font-size:11px; color:var(--mut); border:1px solid var(--line); padding:2px 8px;
       border-radius:999px; font-family:"SFMono-Regular",ui-monospace,Menlo,monospace; cursor:default}
  .pill{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--line)}
  .pill.ok{color:var(--ok); border-color:rgba(57,217,138,.4)}
  .pill.low{color:var(--warn); border-color:rgba(255,176,32,.45)}
  .pill.out{color:var(--bad); border-color:rgba(255,93,93,.45)}
  .grid{display:grid; grid-template-columns:1fr 340px; gap:16px}
  @media (max-width:760px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .pad{padding:18px}
  .tabs{display:flex; flex-wrap:wrap; gap:4px; padding:6px; background:var(--card2); border-radius:12px; margin-bottom:16px}
  .tab{flex:1 1 auto; min-width:76px; text-align:center; padding:10px 4px; border-radius:9px; cursor:pointer; color:var(--mut); font-weight:600; font-size:14px}
  .tab.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  label{display:block; font-size:13px; color:var(--mut); margin:14px 0 6px; font-weight:600}
  textarea,input[type=text],select{
    width:100%; background:var(--card2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit;
  }
  textarea{min-height:120px; resize:vertical}
  .row{display:flex; gap:10px} .row>*{flex:1}
  .drop{
    border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
    color:var(--mut); cursor:pointer; transition:.15s; background:var(--card2);
  }
  .drop.hover{border-color:var(--accent); color:var(--ink)}
  .switch{display:flex; align-items:center; gap:10px; margin-top:14px; cursor:pointer; user-select:none}
  .switch input{display:none}
  .track{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
  .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track .knob{left:21px}
  .muted{color:var(--mut); font-size:12.5px}
  .btn{
    margin-top:18px; width:100%; border:0; border-radius:12px; padding:14px; cursor:pointer;
    font-weight:800; font-size:16px; color:#fff; letter-spacing:.3px;
    background:linear-gradient(135deg,var(--accent),#ff8a5c);
  }
  .btn:disabled{filter:grayscale(.6) brightness(.8); cursor:not-allowed}
  .btn.busy{opacity:.7}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:#111; color:#fff; padding:11px 18px; border-radius:10px; opacity:0; pointer-events:none;
    transition:.25s; font-weight:600; box-shadow:var(--shadow)}
  .toast.show{opacity:1}
  .toast.ok{background:#12603f} .toast.bad{background:#7a2020}
  .previewCard{position:sticky; top:16px}
  .rollhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rollhead b{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .paper{
    background:var(--paper); color:#111; border-radius:6px; padding:14px 16px 26px;
    box-shadow:inset 0 0 0 1px #e7e7df, var(--shadow); max-height:60vh; overflow:auto;
    background-image:repeating-linear-gradient(#fbfbf7 0 27px,#f2f2ec 27px 28px);
  }
  .paper.txt{font:13px/1.55 "SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word}
  .paper img{width:100%; image-rendering:pixelated; display:block; background:#fff}
  .paper .center{text-align:center} .paper .right{text-align:right}
  .paper .big{font-size:19px; font-weight:700}
  .len{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
  .hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Prn<span>t</span>r</div>
    <span class="ver" title="version {{ version }} · commit {{ sha }} · built {{ build_date }}">v{{ version }} · {{ sha }}</span>
    <div class="status">
      <span id="paper" class="pill hide"></span>
      <span id="dot" class="dot"></span><span id="stat">checking…</span>
    </div>
  </header>

  <div class="grid">
    <div class="card pad">
      <div class="tabs">
        <div class="tab active" data-tab="text">✍️ Text</div>
        <div class="tab" data-tab="image">🖼️ Image</div>
        <div class="tab" data-tab="banner">🔠 Banner</div>
        <div class="tab" data-tab="checklist">☑️ List</div>
        <div class="tab" data-tab="poster">🧩 Poster</div>
      </div>

      <!-- TEXT -->
      <section id="tab-text">
        <label>Title <span class="muted">(optional, big &amp; bold)</span></label>
        <input type="text" id="t-title" placeholder="e.g. NOTICE">
        <label>Message</label>
        <textarea id="t-body" placeholder="Type anything… it wraps at {{ cols }} characters, just like the paper."></textarea>
        <div class="row">
          <div><label>Align</label>
            <select id="t-align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div>
          <div><label>Size</label>
            <select id="t-size"><option value="1">Normal</option><option value="2">Large</option></select></div>
        </div>
        <button class="btn" id="print-text">Print text</button>
      </section>

      <!-- IMAGE -->
      <section id="tab-image" class="hide">
        <div class="drop" id="drop">
          <div id="drop-label">Tap to choose a photo, or drop one here</div>
          <input type="file" id="file" accept="image/*" class="hide">
        </div>
        <div class="row">
          <div><label>Orientation</label>
            <select id="i-orient"><option value="auto">Auto</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
          <div><label>Rendering</label>
            <select id="i-method">
              <option value="floyd">Dither — Floyd (photos)</option>
              <option value="atkinson">Dither — Atkinson (thermal)</option>
              <option value="ordered">Dither — Ordered (retro)</option>
              <option value="threshold">Threshold (line art)</option>
              <option value="edge">Edge trace (outline)</option>
              <option value="halftone">Halftone dots</option>
            </select></div>
        </div>
        <div id="thr-wrap" class="hide">
          <label><span id="thr-label">Threshold</span> <span class="muted" id="thr-val">128</span></label>
          <input type="range" id="i-thr" min="40" max="220" value="128" style="width:100%">
        </div>
        <div id="cell-wrap" class="hide">
          <label>Dot size <span class="muted" id="cell-val">7</span></label>
          <input type="range" id="i-cell" min="4" max="16" value="7" style="width:100%">
        </div>
        <label class="switch"><input type="checkbox" id="i-pola"><span class="track"><span class="knob"></span></span>
          <span>Polaroid frame <span class="muted">— framed photo + handwritten caption</span></span></label>
        <div id="cap-wrap" class="hide">
          <label>Caption</label>
          <input type="text" id="i-cap" placeholder="Wish you were here ✨" maxlength="80">
        </div>
        <button class="btn" id="print-image" disabled>Print image</button>
      </section>

      <!-- BANNER -->
      <section id="tab-banner" class="hide">
        <label>Banner text <span class="muted">— huge bold headline, fills the width</span></label>
        <textarea id="ban-text" placeholder="SALE&#10;TODAY ONLY"></textarea>
        <button class="btn" id="print-banner">Print banner</button>
      </section>

      <!-- CHECKLIST -->
      <section id="tab-checklist" class="hide">
        <label>Title <span class="muted">(optional)</span></label>
        <input type="text" id="cl-title" placeholder="Packing list">
        <label>Items <span class="muted">— one per line, each gets a ☐ to tick</span></label>
        <textarea id="cl-items" placeholder="Passport&#10;Phone charger&#10;Sunscreen"></textarea>
        <button class="btn" id="print-checklist">Print checklist</button>
      </section>

      <!-- POSTER -->
      <section id="tab-poster" class="hide">
        <div class="drop" id="p-drop">
          <div id="p-drop-label">Tap to choose an image, or drop one here</div>
          <input type="file" id="p-file" accept="image/*" class="hide">
        </div>
        <div class="row">
          <div><label>Strips wide <span class="muted" id="p-width-hint"></span></label>
            <select id="p-strips">
              <option value="2">2 strips</option>
              <option value="3" selected>3 strips</option>
              <option value="4">4 strips</option>
              <option value="5">5 strips</option>
              <option value="6">6 strips</option>
            </select></div>
          <div><label>Rendering</label>
            <select id="p-method">
              <option value="halftone" selected>Halftone dots</option>
              <option value="atkinson">Dither — Atkinson</option>
              <option value="ordered">Dither — Ordered</option>
              <option value="floyd">Dither — Floyd</option>
              <option value="threshold">Threshold</option>
              <option value="edge">Edge trace</option>
            </select></div>
        </div>
        <label>Glue gap <span class="muted"><span id="p-gap-val">5</span> mm blank on the right of each strip</span></label>
        <input type="range" id="p-gap" min="2" max="12" value="5" style="width:100%">
        <div id="p-thr-wrap" class="hide">
          <label><span id="p-thr-label">Threshold</span> <span class="muted" id="p-thr-val">128</span></label>
          <input type="range" id="p-thr" min="40" max="220" value="128" style="width:100%">
        </div>
        <div id="p-cell-wrap">
          <label>Dot size <span class="muted" id="p-cell-val">7</span></label>
          <input type="range" id="p-cell" min="4" max="16" value="7" style="width:100%">
        </div>
        <label class="switch"><input type="checkbox" id="p-rotate"><span class="track"><span class="knob"></span></span>
          <span>Rotate 90° <span class="muted">— for a portrait source</span></span></label>
        <label class="switch"><input type="checkbox" id="p-label" checked><span class="track"><span class="knob"></span></span>
          <span>Label each strip <span class="muted">— prints “strip 2/4” above the art</span></span></label>
        <button class="btn" id="print-poster" disabled>Print poster strips</button>
      </section>
    </div>

    <div class="card pad previewCard">
      <div class="rollhead"><b>Live preview</b><span class="muted">{{ width }}px wide</span></div>
      <div class="paper txt" id="preview">Your print appears here.</div>
      <div class="len" id="len"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COLS = {{ cols }};
const $ = s => document.querySelector(s);
const preview = $("#preview"), lenEl = $("#len");
let curTab = "text", imgFile = null, posterFile = null, prevTimer = null, prevURL = null;

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  curTab = t.dataset.tab;
  ["text","image","banner","checklist","poster"].forEach(n =>
    $("#tab-"+n).classList.toggle("hide", curTab !== n));
  renderPreview();
});

function toast(msg, kind){
  const el = $("#toast"); el.textContent = msg; el.className = "toast show " + (kind||"");
  setTimeout(() => el.className = "toast", 2600);
}

// ---------- status + paper ----------
const PAPER_TEXT = { ok:"Paper OK", low:"Paper low", out:"Out of paper" };
async function poll(){
  try{
    const s = await (await fetch("/api/status")).json();
    $("#dot").className = "dot " + (s.online ? "ok" : "bad");
    let txt = s.online ? `TM-m30II · ${s.host}` : `offline · ${s.host}`;
    if(s.cover_open) txt = "cover open";
    else if(s.error) txt = "printer error";
    $("#stat").textContent = txt;
    const pill = $("#paper");
    if(s.online && PAPER_TEXT[s.paper]){
      pill.textContent = PAPER_TEXT[s.paper];
      pill.className = "pill " + s.paper;
    } else { pill.className = "pill hide"; }
  }catch{ $("#dot").className = "dot bad"; $("#stat").textContent = "app error"; }
}
poll(); setInterval(poll, 5000);

// ---------- shared preview helpers ----------
function showText(msg){
  const d = document.createElement("div"); d.textContent = msg;
  preview.className = "paper txt"; preview.replaceChildren(d); lenEl.textContent = "";
}
function showPng(blob, info){
  if(prevURL) URL.revokeObjectURL(prevURL);
  prevURL = URL.createObjectURL(blob);
  preview.className = "paper"; preview.replaceChildren();
  const im = document.createElement("img"); im.src = prevURL; im.alt = "print preview";
  preview.appendChild(im);
  lenEl.textContent = info || "";
}
async function serverPreview(url, opts, infoFn){
  try{
    const r = await fetch(url, opts);
    if(!r.ok) throw new Error();
    const blob = await r.blob();
    const h = r.headers;
    showPng(blob, infoFn ? infoFn(h) : (h.get("X-Print-Length-Mm") ? `≈ ${h.get("X-Print-Length-Mm")} mm of paper` : ""));
  }catch{ showText("Couldn't render that."); }
}

// ---------- TEXT ----------
function wrapMono(str, cols){
  const out = [];
  for(const para of str.split("\n")){
    if(!para.trim()){ out.push(""); continue; }
    let line = "";
    for(const word of para.split(/\s+/)){
      let w = word;
      while(w.length > cols){ if(line){out.push(line); line="";} out.push(w.slice(0,cols)); w = w.slice(cols); }
      if((line + (line?" ":"") + w).length <= cols){ line = line ? line+" "+w : w; }
      else { if(line) out.push(line); line = w; }
    }
    out.push(line);
  }
  return out.join("\n");
}
function renderTextPreview(){
  const title = $("#t-title").value.trim(), size = $("#t-size").value, align = $("#t-align").value;
  preview.className = "paper txt"; preview.replaceChildren();
  if(title){
    const d = document.createElement("div"); d.className = "center big";
    d.textContent = wrapMono(title, Math.max(1, Math.floor(COLS/2))); preview.appendChild(d);
  }
  const cols = Math.max(1, Math.floor(COLS/(size==="2"?2:1)));
  const b = document.createElement("div");
  b.className = (align==="center"?"center":align==="right"?"right":"") + (size==="2"?" big":"");
  b.textContent = wrapMono($("#t-body").value, cols) || "…";
  preview.appendChild(b); lenEl.textContent = "";
}

// ---------- IMAGE ----------
function imageForm(){
  const fd = new FormData();
  fd.append("image", imgFile);
  fd.append("orientation", $("#i-orient").value);
  fd.append("method", $("#i-method").value);
  fd.append("threshold", $("#i-thr").value);
  fd.append("cell", $("#i-cell").value);
  fd.append("polaroid", $("#i-pola").checked ? "1" : "0");
  fd.append("caption", $("#i-cap").value);
  return fd;
}
function renderImagePreview(){
  if(!imgFile) return showText("Choose a photo to see how it'll print.");
  serverPreview("/api/preview/image", { method:"POST", body:imageForm() });
}

// ---------- POSTER ----------
function posterForm(){
  const fd = new FormData();
  fd.append("image", posterFile);
  fd.append("strips", $("#p-strips").value);
  fd.append("gap_mm", $("#p-gap").value);
  fd.append("method", $("#p-method").value);
  fd.append("threshold", $("#p-thr").value);
  fd.append("cell", $("#p-cell").value);
  fd.append("rotate", $("#p-rotate").checked ? "1" : "0");
  fd.append("label", $("#p-label").checked ? "1" : "0");
  return fd;
}
function posterInfo(h){
  const n = h.get("X-Strips"), each = h.get("X-Print-Length-Mm"),
        total = h.get("X-Total-Mm"), w = h.get("X-Poster-Width-Mm");
  return `${n} strips · poster ${w} × ${each} mm · ${total} mm of paper total`;
}
function renderPosterPreview(){
  if(!posterFile) return showText("Choose an image to tile into a poster.");
  serverPreview("/api/preview/poster", { method:"POST", body:posterForm() }, posterInfo);
}
function updatePosterHint(){
  const strips = parseInt($("#p-strips").value,10);
  const gapmm = parseInt($("#p-gap").value,10);
  const mm = Math.round(strips * (72 - gapmm));      // 72mm printable per strip
  $("#p-width-hint").textContent = `≈ ${mm} mm wide`;
  $("#p-gap-val").textContent = gapmm;
}

// ---------- BANNER / CHECKLIST ----------
function renderBannerPreview(){
  if(!$("#ban-text").value.trim()) return showText("Type a headline.");
  serverPreview("/api/preview/banner", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ text:$("#ban-text").value }) });
}
function renderChecklistPreview(){
  if(!$("#cl-items").value.trim() && !$("#cl-title").value.trim()) return showText("Add some items.");
  serverPreview("/api/preview/checklist", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ title:$("#cl-title").value, items:$("#cl-items").value }) });
}

function renderPreview(){
  clearTimeout(prevTimer);
  const fn = { text:renderTextPreview, image:renderImagePreview, banner:renderBannerPreview,
               checklist:renderChecklistPreview, poster:renderPosterPreview }[curTab];
  prevTimer = setTimeout(fn, 220);
}

// ---------- input wiring ----------
["#t-title","#t-body","#t-align","#t-size"].forEach(s => $(s).addEventListener("input", renderPreview));
$("#ban-text").addEventListener("input", renderPreview);
["#cl-title","#cl-items"].forEach(s => $(s).addEventListener("input", renderPreview));

function wireDrop(dropSel, inputSel, labelSel, onFile){
  const drop = $(dropSel), input = $(inputSel);
  drop.onclick = () => input.click();
  ["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev=>{ev.preventDefault();drop.classList.add("hover");}));
  ["dragleave","drop"].forEach(e => drop.addEventListener(e, ev=>{ev.preventDefault();drop.classList.remove("hover");}));
  drop.addEventListener("drop", ev => { if(ev.dataTransfer.files[0]) pick(ev.dataTransfer.files[0]); });
  input.onchange = () => { if(input.files[0]) pick(input.files[0]); };
  function pick(f){ $(labelSel).textContent = "📷 " + f.name; onFile(f); renderPreview(); }
}
wireDrop("#drop", "#file", "#drop-label", f => { imgFile = f; $("#print-image").disabled = false; });
wireDrop("#p-drop", "#p-file", "#p-drop-label", f => { posterFile = f; $("#print-poster").disabled = false; });

$("#i-orient").addEventListener("change", renderPreview);
$("#i-method").addEventListener("change", () => {
  const m = $("#i-method").value, showThr = (m === "threshold" || m === "edge");
  $("#thr-wrap").classList.toggle("hide", !showThr);
  $("#thr-label").textContent = (m === "edge") ? "Edge sensitivity" : "Threshold";
  $("#cell-wrap").classList.toggle("hide", m !== "halftone");
  renderPreview();
});
$("#i-thr").addEventListener("input", () => { $("#thr-val").textContent = $("#i-thr").value; renderPreview(); });
$("#i-cell").addEventListener("input", () => { $("#cell-val").textContent = $("#i-cell").value; renderPreview(); });
$("#i-pola").addEventListener("change", () => { $("#cap-wrap").classList.toggle("hide", !$("#i-pola").checked); renderPreview(); });
$("#i-cap").addEventListener("input", renderPreview);

$("#p-method").addEventListener("change", () => {
  const m = $("#p-method").value, showThr = (m === "threshold" || m === "edge");
  $("#p-thr-wrap").classList.toggle("hide", !showThr);
  $("#p-thr-label").textContent = (m === "edge") ? "Edge sensitivity" : "Threshold";
  $("#p-cell-wrap").classList.toggle("hide", m !== "halftone");
  renderPreview();
});
$("#p-strips").addEventListener("change", () => { updatePosterHint(); renderPreview(); });
$("#p-gap").addEventListener("input", () => { updatePosterHint(); renderPreview(); });
$("#p-thr").addEventListener("input", () => { $("#p-thr-val").textContent = $("#p-thr").value; renderPreview(); });
$("#p-cell").addEventListener("input", () => { $("#p-cell-val").textContent = $("#p-cell").value; renderPreview(); });
$("#p-rotate").addEventListener("change", renderPreview);

// ---------- print actions ----------
async function withBusy(btn, fn){ btn.classList.add("busy"); btn.disabled = true; try{ await fn(); } finally { btn.classList.remove("busy"); btn.disabled = false; } }
async function postJSON(url, body){ const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); return [r, await r.json().catch(()=>({}))]; }
function done(r, j){ toast(r.ok ? (j.length_mm ? `Printed ✓ (${j.length_mm}mm)` : "Printed ✓") : ("Failed: "+(j.error||"error")), r.ok?"ok":"bad"); }

$("#print-text").onclick = () => withBusy($("#print-text"), async () => {
  if(!$("#t-body").value.trim() && !$("#t-title").value.trim()){ toast("Nothing to print","bad"); return; }
  const [r,j] = await postJSON("/api/print/text", { text:$("#t-body").value, title:$("#t-title").value.trim(), align:$("#t-align").value, size:$("#t-size").value });
  done(r,j);
});
$("#print-image").onclick = () => withBusy($("#print-image"), async () => {
  if(!imgFile){ toast("Choose a photo first","bad"); return; }
  const r = await fetch("/api/print/image", { method:"POST", body:imageForm() });
  done(r, await r.json().catch(()=>({})));
});
$("#print-banner").onclick = () => withBusy($("#print-banner"), async () => {
  if(!$("#ban-text").value.trim()){ toast("Type a headline","bad"); return; }
  const [r,j] = await postJSON("/api/print/banner", { text:$("#ban-text").value }); done(r,j);
});
$("#print-checklist").onclick = () => withBusy($("#print-checklist"), async () => {
  if(!$("#cl-items").value.trim()){ toast("Add some items","bad"); return; }
  const [r,j] = await postJSON("/api/print/checklist", { title:$("#cl-title").value, items:$("#cl-items").value }); done(r,j);
});
$("#print-poster").onclick = () => withBusy($("#print-poster"), async () => {
  if(!posterFile){ toast("Choose an image first","bad"); return; }
  const r = await fetch("/api/print/poster", { method:"POST", body:posterForm() });
  const j = await r.json().catch(()=>({}));
  toast(r.ok ? `Printed ${j.strips} strips ✓ (${j.total_mm}mm total)` : ("Failed: "+(j.error||"error")), r.ok?"ok":"bad");
});

updatePosterHint();
renderTextPreview();
</script>
</body>
</html>
